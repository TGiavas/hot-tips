[project]
name = "hot-tips-backend"
version = "0.1.0"
description = "Arena Hot Tips backend (Django + DRF)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15,<4.0",
    "gunicorn>=23.0,<24.0",
    "whitenoise[brotli]>=6.7,<7.0",
    "django-allauth[socialaccount]>=65.3,<66.0",
    # Required by allauth's OAuth2 providers (Discord).
    "requests>=2.32,<3.0",
    "PyJWT>=2.9,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "time-machine>=2.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hot_tips.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # WhiteNoise warns once per request when STATIC_ROOT doesn't exist on disk
    # (we only run `collectstatic` in the prod Docker stage). Harmless in tests.
    "ignore:No directory at:UserWarning",
]

[tool.uv]
package = false
